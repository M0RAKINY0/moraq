name: PR title

# Squash merges use the PR title as the commit message on main, so the title is what has to follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Pass the title through env, never inline it in the script, so a crafted title can't inject shell commands.
      - run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
