name: Publish

# Publishing a GitHub Release with a tag like v0.1.0 publishes that version to npm.
# Uses npm trusted publishing (OIDC), so no npm token is stored in this repo. See RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'M0RAKINY0/moraq'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets npm verify this workflow's identity and attach provenance to the package.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships an npm new enough for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a version like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$PRERELEASE" == "true" ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run size

      - name: Skip if this version is already on npm
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@moraq/core@$VERSION" version >/dev/null 2>&1; then
            echo "@moraq/core@$VERSION is already published, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm publish --tag "$DIST_TAG"
